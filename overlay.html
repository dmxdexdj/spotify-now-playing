<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Now Playing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231db954'/%3E%3Cpath d='M13 21V9l9-2v12' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='11' cy='21' r='3' fill='%23fff'/%3E%3Ccircle cx='20' cy='19' r='3' fill='%23fff'/%3E%3C/svg%3E">
<style>
  /* All styling comes from /customize (saved in settings.json). URL options: ?poll=5000 (fallback polling, ms), ?demo=1 */
  @property --accent { syntax: '<color>'; inherits: true; initial-value: #1db954; }
  :root {
    --accent: #1db954; --fg: #fff; --sub: rgba(255,255,255,.7); --bg: rgba(18,18,18,.82);
    --font: "Segoe UI", system-ui, sans-serif; --w: 420px; --r: 16px; --ts: 20px; --as: 15px;
    --k: 1; --art: 84px; --dim: .55;
    --enter: translate(-24px, 0); --shadow: 0 8px 30px rgba(0,0,0,.35); --blur: blur(8px);
    transition: --accent .8s ease;
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: var(--font); }

  /* full-screen layout: blurred album art behind everything */
  #bgfs { display: none; position: fixed; inset: -6%; z-index: 0; background-size: cover; background-position: center;
          filter: blur(46px) saturate(1.25); opacity: 0; transition: opacity .8s ease; pointer-events: none; }
  #bgfs.show { opacity: 1; }
  body.layout-fullscreen #bgfs { display: block; }

  #stage { position: fixed; inset: 0; z-index: 1; display: flex; box-sizing: border-box; padding: 32px; }

  #card {
    position: relative; flex: none; display: flex; align-items: center; gap: 16px;
    width: var(--w); box-sizing: border-box; padding: 14px 18px 14px 14px;
    border-radius: var(--r); background: var(--bg); color: var(--fg);
    backdrop-filter: var(--blur); box-shadow: var(--shadow);
    opacity: 0; transform: var(--enter);
    transition: opacity .6s ease, transform .6s ease;
  }
  #card.show { opacity: 1; transform: none; }

  /* "new song" flash */
  #card::after { content: ""; position: absolute; inset: -5px; border: 3px solid var(--accent); border-radius: inherit; opacity: 0; pointer-events: none; }
  #card.flash::after { animation: pulse 3s ease-out 1; }
  @keyframes pulse { 0% { opacity: 0; transform: scale(.96); } 12% { opacity: 1; transform: none; } 65% { opacity: 1; } 100% { opacity: 0; } }

  #artwrap { position: relative; flex: none; display: flex; }
  #art { display: block; width: var(--art); height: var(--art); border-radius: calc(var(--r) * .65); object-fit: cover; background: #333; }
  #hole { display: none; }
  #info { min-width: 0; flex: 1; }
  .label { font-size: calc(11px * var(--k)); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
  .line { overflow: hidden; white-space: nowrap; }
  .line span { display: inline-block; }

  /* Long text glides to the end, pauses, glides back, pauses. No snapping. */
  .line.scroll { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 22px), transparent); }
  .line.scroll span { animation: marquee var(--dur, 8s) ease-in-out infinite alternate; }
  @keyframes marquee { 0%, 20% { transform: translateX(0); } 80%, 100% { transform: translateX(var(--shift)); } }

  #title { font-size: calc(var(--ts) * var(--k)); font-weight: 700; line-height: 1.25; }
  #artist { font-size: calc(var(--as) * var(--k)); color: var(--sub); margin-top: 2px; line-height: 1.3; }
  #bar { height: 4px; border-radius: 2px; background: rgba(128,128,128,.3); margin-top: 12px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; }
  .noart #artwrap, .nolabel .label, .nobar #bar { display: none; }

  /* ---- layouts ---- */
  body.layout-compact { --art: 52px; }
  .layout-compact #card { width: fit-content; max-width: var(--w); min-width: 180px; border-radius: 999px; padding: 8px 26px 8px 8px; gap: 12px; }
  .layout-compact #art { border-radius: 50%; }
  .layout-compact .label { display: none; }
  .layout-compact #bar { margin-top: 6px; height: 3px; }

  body.layout-wide { --art: 88px; --k: 1.15; }
  .layout-wide #card { flex: 1; width: auto; padding: 16px 28px 16px 16px; gap: 22px; }

  body.layout-vinyl { --art: 104px; }
  .layout-vinyl #card { padding-left: 22px; gap: 20px; }
  .layout-vinyl #art { border-radius: 50%; animation: spin 9s linear infinite;
    box-shadow: 0 0 0 5px #0e0e0e, 0 0 0 7px #262626, 0 6px 18px rgba(0,0,0,.5); }
  body.paused.layout-vinyl #art { animation-play-state: paused; }
  .layout-vinyl #artwrap::after { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: repeating-radial-gradient(circle, transparent 0 3px, rgba(0,0,0,.14) 3px 4px),
                conic-gradient(from 25deg, transparent 0 22%, rgba(255,255,255,.14) 27%, transparent 32% 72%, rgba(255,255,255,.1) 77%, transparent 82%); }
  .layout-vinyl #hole { display: block; position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px;
    border-radius: 50%; background: #101010; box-shadow: 0 0 0 3px #2a2a2a; z-index: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }

  body.layout-fullscreen { --art: 380px; --k: 2.1; }
  .layout-fullscreen #card { flex-direction: column; gap: 34px; width: auto; max-width: 92vw; padding: 0;
    background: transparent; box-shadow: none; backdrop-filter: none; text-align: center; }
  .layout-fullscreen #art { border-radius: calc(var(--r) * 1.3); box-shadow: 0 22px 70px rgba(0,0,0,.55); }
  .layout-fullscreen #info { flex: none; width: min(680px, 86vw); }
  .layout-fullscreen .label { margin-bottom: 10px; }
  .layout-fullscreen #bar { height: 6px; margin-top: 20px; border-radius: 3px; }
</style>
</head>
<body class="layout-classic">
<div id="bgfs"></div>
<div id="stage">
  <div id="card">
    <div id="artwrap"><img id="art" alt=""><i id="hole"></i></div>
    <div id="info">
      <div class="label" id="label">Now playing</div>
      <div class="line" id="titleLine"><span id="title"></span></div>
      <div class="line" id="artistLine"><span id="artist"></span></div>
      <div id="bar"><i id="fill"></i></div>
    </div>
  </div>
</div>

<script>
const q = new URLSearchParams(location.search);
const PREVIEW = q.get('preview') === '1';                       // inside /customize: unsaved settings arrive by postMessage
const SOURCE_DEMO = q.get('demo') === '1' || q.get('source') === 'demo';
const POLL_MS = Math.max(2000, Number(q.get('poll')) || 3000);  // only used if the live stream can't connect

const FONTS = {
  segoe: '"Segoe UI", system-ui, -apple-system, sans-serif', arial: 'Arial, Helvetica, sans-serif',
  verdana: 'Verdana, Geneva, sans-serif', tahoma: 'Tahoma, Geneva, sans-serif',
  trebuchet: '"Trebuchet MS", sans-serif', georgia: 'Georgia, serif',
  impact: 'Impact, "Arial Narrow", sans-serif', consolas: 'Consolas, "Courier New", monospace',
  comic: '"Comic Sans MS", "Comic Neue", cursive', system: 'system-ui, -apple-system, sans-serif',
};
const LAYOUTS = ['classic', 'compact', 'wide', 'vinyl', 'fullscreen'];
const ALIGN = { top: 'flex-start', left: 'flex-start', center: 'center', bottom: 'flex-end', right: 'flex-end' };
const DEFAULTS = {
  layout: 'classic', position: 'bottom-left', margin: 32, width: 420, scale: 100,
  bgColor: '#121212', bgOpacity: 82, textColor: '#ffffff', accent: '#1db954', chameleon: false,
  font: 'segoe', titleSize: 20, artistSize: 15, radius: 16, bgDim: 55,
  showArt: true, showProgress: true, showLabel: true, labelText: 'Now playing',
  showPaused: false, shadow: true, blur: true, idleMode: 'demo', flashOnChange: false, explicitMode: 'show',
};
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const svgUri = s => 'data:image/svg+xml;utf8,' + encodeURIComponent(s);
const DEMO_ART = svgUri('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4d6d"/><stop offset="1" stop-color="#4d79ff"/></linearGradient></defs><rect width="300" height="300" fill="url(#g)"/></svg>');
const MASK_ART = svgUri('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="#2a2a2e"/></svg>');
const demoTrack = () => ({ isPlaying: true, title: 'Midnight City Lights (Extended Mix)', artist: 'The Neon Skyline, Another Artist, Third Artist Name', art: DEMO_ART, progressMs: Date.now() % 200000, durationMs: 200000 });

const $ = id => document.getElementById(id);
const card = $('card'), bgfs = $('bgfs'), artEl = $('art'), root = document.documentElement;
let S = { ...DEFAULTS }, lastApplied = '', haveData = false, raw = null, artAccent = null;
let current = { key: null, progressMs: 0, durationMs: 0, at: 0, playing: false };
let swapTimer = null, flashTimer = null;

// ---------- colour helpers (Chameleon mode) ----------
function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  let h = 0, s = 0;
  if (d) {
    s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? ((g - b) / d + (g < b ? 6 : 0)) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h /= 6;
  }
  return [h, s, l];
}
function hsl2hex(h, s, l) {
  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
  return '#' + [f(0), f(8), f(4)].map(v => v.toString(16).padStart(2, '0')).join('');
}
function pickColor(img) {
  try {
    const n = 24, c = document.createElement('canvas'); c.width = c.height = n;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(img, 0, 0, n, n);
    const d = x.getImageData(0, 0, n, n).data;
    const buckets = Array.from({ length: 12 }, () => ({ w: 0, r: 0, g: 0, b: 0 }));
    let tr = 0, tg = 0, tb = 0, tn = 0;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i + 3] < 200) continue;
      const [h, s, l] = rgb2hsl(d[i], d[i + 1], d[i + 2]);
      tr += d[i]; tg += d[i + 1]; tb += d[i + 2]; tn++;
      if (l < .12 || l > .92 || s < .2) continue;           // skip near-black, near-white and grey
      const w = s * (1 - Math.abs(2 * l - 1));              // favour vivid, mid-light pixels
      const b = buckets[Math.min(11, Math.floor(h * 12))];
      b.w += w; b.r += d[i] * w; b.g += d[i + 1] * w; b.b += d[i + 2] * w;
    }
    let best = null;
    for (const b of buckets) if (b.w > 0 && (!best || b.w > best.w)) best = b;
    if (best && best.w > .5) {
      const [h, s, l] = rgb2hsl(best.r / best.w, best.g / best.w, best.b / best.w);
      return hsl2hex(h, Math.max(s, .55), Math.min(.68, Math.max(.5, l)));
    }
    if (!tn) return null;                                    // mostly grey art: keep it neutral, just make it readable
    const [h, s, l] = rgb2hsl(tr / tn, tg / tn, tb / tn);
    return hsl2hex(h, s, Math.min(.8, Math.max(.55, l)));
  } catch { return null; }                                   // tainted canvas etc.: fall back to the accent colour
}
function applyAccent() {
  if (S.chameleon && !artAccent && artEl.complete && artEl.naturalWidth) artAccent = pickColor(artEl);
  root.style.setProperty('--accent', (S.chameleon && artAccent) || S.accent);
}

// ---------- settings ----------
function applySettings(s) {
  s = { ...DEFAULTS, ...s };
  const json = JSON.stringify(s);
  if (json === lastApplied) return;
  lastApplied = json; S = s;
  const set = (k, v) => root.style.setProperty(k, v);
  set('--fg', s.textColor); set('--sub', rgba(s.textColor, .7));
  set('--bg', rgba(s.bgColor, s.bgOpacity / 100));
  set('--font', FONTS[s.font] || FONTS.segoe);
  set('--w', s.width + 'px'); set('--r', s.radius + 'px');
  set('--ts', s.titleSize + 'px'); set('--as', s.artistSize + 'px');
  set('--dim', s.bgDim / 100);
  set('--shadow', s.shadow ? '0 8px 30px rgba(0,0,0,.35)' : 'none');
  set('--blur', s.blur ? 'blur(8px)' : 'none');

  const layout = LAYOUTS.includes(s.layout) ? s.layout : 'classic';
  LAYOUTS.forEach(l => document.body.classList.toggle('layout-' + l, l === layout));
  const [v, h] = s.position === 'center' ? ['center', 'center'] : s.position.split('-');
  const stage = $('stage');
  stage.style.alignItems = layout === 'fullscreen' ? 'center' : ALIGN[v];
  stage.style.justifyContent = layout === 'fullscreen' ? 'center' : ALIGN[h];
  stage.style.padding = s.margin + 'px';
  // slide in from the nearest edge
  set('--enter', layout === 'fullscreen' ? 'translate(0,24px)' : h === 'right' ? 'translate(24px,0)' : h === 'left' ? 'translate(-24px,0)' : v === 'bottom' ? 'translate(0,24px)' : 'translate(0,-24px)');
  card.style.zoom = s.scale / 100;

  document.body.classList.toggle('noart', !s.showArt);
  document.body.classList.toggle('nobar', !s.showProgress);
  document.body.classList.toggle('nolabel', !s.showLabel);
  $('label').textContent = s.labelText;

  applyAccent();
  fit('titleLine', 'title'); fit('artistLine', 'artist');   // sizes changed, re-measure
  if (haveData) handle(raw);                                 // idle / explicit rules may have changed
}

// ---------- text ----------
function fit(lineId, textId) {
  const line = $(lineId), el = $(textId);
  line.classList.remove('scroll');
  line.style.removeProperty('--shift');
  requestAnimationFrame(() => {
    const overflow = el.offsetWidth - line.clientWidth;
    if (overflow > 4) {
      line.style.setProperty('--shift', `-${overflow + 22}px`);
      line.style.setProperty('--dur', Math.max(6, overflow / 22 + 5) + 's');
      line.classList.add('scroll');
    }
  });
}
function setText(lineId, textId, text) { $(textId).textContent = text || ''; fit(lineId, textId); }

// ---------- album art ----------
function artSrc(u) {
  try { if (/(^|\.)(scdn\.co|spotifycdn\.com)$/.test(new URL(u).hostname)) return 'api/art?u=' + encodeURIComponent(u); } catch {}
  return u;
}
function setArt(url) {
  if (!url) { artEl.removeAttribute('src'); bgfs.style.backgroundImage = 'none'; artAccent = null; applyAccent(); return; }
  const src = artSrc(url);
  artEl.crossOrigin = 'anonymous';
  artEl.onload = () => { artAccent = S.chameleon ? pickColor(artEl) : null; applyAccent(); };
  artEl.onerror = () => {                                    // no CORS on this image: show it anyway, skip colour matching
    if (artEl.crossOrigin) { artEl.removeAttribute('crossorigin'); artEl.src = url; artAccent = null; applyAccent(); }
  };
  artEl.src = src;
  bgfs.style.backgroundImage = `linear-gradient(rgba(0,0,0,var(--dim)),rgba(0,0,0,var(--dim))), url("${src.replace(/"/g, '%22')}")`;
}

// ---------- showing / hiding ----------
function flash() {
  card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
  clearTimeout(flashTimer); flashTimer = setTimeout(() => card.classList.remove('flash'), 3200);
}
function hide() {
  clearTimeout(swapTimer);
  card.classList.remove('show'); bgfs.classList.remove('show');
  current.key = null;
}
function render(t, demo, masked) {
  const key = (demo ? 'D|' : masked ? 'M|' : '') + t.title + '|' + t.artist;
  document.body.classList.toggle('paused', !t.isPlaying);
  if (key !== current.key) {
    const first = !current.key;
    card.classList.remove('show'); bgfs.classList.remove('show');
    clearTimeout(swapTimer);
    swapTimer = setTimeout(() => {                           // fade out, swap, fade back in
      setText('titleLine', 'title', t.title);
      setText('artistLine', 'artist', t.artist);
      setArt(t.art);
      card.classList.add('show'); bgfs.classList.add('show');
      if (S.flashOnChange && !demo) flash();
    }, first ? 0 : 450);
    current.key = key;
  } else {
    card.classList.add('show'); bgfs.classList.add('show');
  }
  current.progressMs = t.progressMs || 0; current.durationMs = t.durationMs || 0;
  current.at = performance.now(); current.playing = !!t.isPlaying;
}

// d = what the server says is playing (or null when we couldn't reach it)
function handle(d) {
  raw = d; haveData = true;
  let t = d && d.title && (d.isPlaying || S.showPaused) ? d : null, demo = false;
  if (SOURCE_DEMO) { t = demoTrack(); demo = true; }
  else if (!t && (S.idleMode === 'demo' || PREVIEW)) { t = demoTrack(); demo = true; }  // paused / unlinked / API error: never look broken
  if (!t) return hide();
  let masked = false;
  if (!demo && t.explicit) {
    if (S.explicitMode === 'hide') return hide();
    if (S.explicitMode === 'mask') { t = { ...t, title: 'Explicit track', art: MASK_ART }; masked = true; }
  }
  render(t, demo, masked);
}

// smooth progress bar between updates
function tick() {
  if (current.durationMs) {
    const p = current.progressMs + (current.playing ? performance.now() - current.at : 0);
    $('fill').style.width = Math.min(100, (p / current.durationMs) * 100) + '%';
  } else $('fill').style.width = '0';
  requestAnimationFrame(tick);
}

// ---------- data: live stream, with plain polling as a fallback ----------
let fallbackTimer = null, fallbackFails = 0, lastEvent = Date.now();
async function pollOnce() {
  try {
    const [d, s] = await Promise.all([
      fetch('api/now-playing', { cache: 'no-store' }).then(r => r.json()),
      PREVIEW ? null : fetch('api/settings', { cache: 'no-store' }).then(r => r.json()),
    ]);
    fallbackFails = 0;
    if (s) applySettings(s);
    handle(d);
  } catch { if (++fallbackFails >= 3) handle(null); }
}
function startFallback() { if (!fallbackTimer) { pollOnce(); fallbackTimer = setInterval(pollOnce, POLL_MS); } }
function stopFallback() { if (fallbackTimer) { clearInterval(fallbackTimer); fallbackTimer = null; } fallbackFails = 0; }

function connect() {
  if (SOURCE_DEMO) { handle(null); setInterval(() => handle(null), 3000); return; }
  if (!window.EventSource) return startFallback();
  const es = new EventSource('api/stream');
  es.addEventListener('now', e => { lastEvent = Date.now(); stopFallback(); try { handle(JSON.parse(e.data)); } catch {} });
  es.addEventListener('settings', e => { lastEvent = Date.now(); if (!PREVIEW) try { applySettings(JSON.parse(e.data)); } catch {} });
  es.onerror = startFallback;                                // EventSource keeps retrying on its own
  setInterval(() => { if (Date.now() - lastEvent > 25000) startFallback(); }, 5000); // a proxy that buffers the stream
}

if (PREVIEW) {
  // inside /customize: take unsaved settings from the parent page
  addEventListener('message', e => { if (e.data && e.data.type === 'settings') applySettings(e.data.settings); });
  parent.postMessage({ type: 'ready' }, '*');
}
applySettings(DEFAULTS);
connect();
tick();
</script>
</body>
</html>
