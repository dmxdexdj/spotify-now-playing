<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Customize overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #14151a; --panel: #1d1f27; --line: #2c2f3a; --fg: #e8e9ee; --mut: #8b8fa0; --accent: #1db954; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  .wrap { display: grid; grid-template-columns: 340px 1fr; min-height: 100vh; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 20px; overflow-y: auto; max-height: 100vh; }
  @media (max-width: 900px) { aside { max-height: none; } }
  h1 { font-size: 18px; margin: 0 0 16px; }
  h2 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); margin: 22px 0 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0; }
  .row label { flex: none; width: 96px; color: var(--fg); }
  .row input[type=range] { flex: 1; accent-color: var(--accent); }
  output { width: 44px; text-align: right; color: var(--mut); font-variant-numeric: tabular-nums; }
  input[type=color] { width: 44px; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: none; padding: 2px; cursor: pointer; }
  input[type=text], select { flex: 1; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  .check { display: flex; align-items: center; gap: 8px; margin: 8px 0; cursor: pointer; }
  .check input { accent-color: var(--accent); }
  .pos { display: grid; grid-template-columns: repeat(3, 34px); gap: 6px; }
  .pos button { height: 26px; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; cursor: pointer; padding: 0; }
  .pos button:hover { border-color: var(--mut); }
  .pos button.on { background: var(--accent); border-color: var(--accent); }
  .btns { display: flex; gap: 8px; margin-top: 22px; }
  button.main { flex: 1; background: var(--accent); color: #04140a; font-weight: 700; border: 0; border-radius: 8px; padding: 10px; cursor: pointer; font-size: 14px; }
  button.ghost { background: none; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; font-size: 14px; }
  #status { margin-top: 10px; min-height: 18px; color: var(--mut); font-size: 13px; }
  #status.ok { color: var(--accent); }
  #status.err { color: #ff6b6b; }
  main { padding: 20px; min-width: 0; }
  .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .bar span { color: var(--mut); }
  .bar button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .bar button.on { border-color: var(--accent); }
  #stageWrap { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 10px; border: 1px solid var(--line); }
  #stageWrap[data-bg=dark] { background: #0b0b0e; }
  #stageWrap[data-bg=light] { background: #e9ecf2; }
  #stageWrap[data-bg=game] { background: linear-gradient(135deg, #1b2a49 0%, #5b2a6e 50%, #c2562c 100%); }
  iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; background: transparent; }
  .url { margin-top: 16px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--mut); }
  .url code { color: var(--fg); user-select: all; }
</style>
</head>
<body>
<div class="wrap">
<aside>
  <h1>Customize overlay</h1>

  <h2>Position</h2>
  <div class="pos" id="pos"></div>
  <div class="row"><label>Edge gap</label><input type="range" data-key="margin" min="0" max="300"><output data-for="margin"></output></div>

  <h2>Size</h2>
  <div class="row"><label>Overall scale</label><input type="range" data-key="scale" min="50" max="300"><output data-for="scale"></output></div>
  <div class="row"><label>Card width</label><input type="range" data-key="width" min="240" max="800"><output data-for="width"></output></div>
  <div class="row"><label>Title text</label><input type="range" data-key="titleSize" min="12" max="48"><output data-for="titleSize"></output></div>
  <div class="row"><label>Artist text</label><input type="range" data-key="artistSize" min="10" max="36"><output data-for="artistSize"></output></div>
  <div class="row"><label>Corners</label><input type="range" data-key="radius" min="0" max="48"><output data-for="radius"></output></div>

  <h2>Colours</h2>
  <div class="row"><label>Background</label><input type="color" data-key="bgColor"></div>
  <div class="row"><label>Opacity</label><input type="range" data-key="bgOpacity" min="0" max="100"><output data-for="bgOpacity"></output></div>
  <div class="row"><label>Text</label><input type="color" data-key="textColor"></div>
  <div class="row"><label>Accent</label><input type="color" data-key="accent"></div>

  <h2>Font</h2>
  <div class="row"><label>Font</label>
    <select data-key="font">
      <option value="segoe">Segoe UI</option><option value="arial">Arial</option><option value="verdana">Verdana</option>
      <option value="tahoma">Tahoma</option><option value="trebuchet">Trebuchet MS</option><option value="georgia">Georgia</option>
      <option value="impact">Impact</option><option value="consolas">Consolas</option><option value="comic">Comic Sans</option>
      <option value="system">System default</option>
    </select></div>

  <h2>Show</h2>
  <label class="check"><input type="checkbox" data-key="showArt"> Album art</label>
  <label class="check"><input type="checkbox" data-key="showProgress"> Progress bar</label>
  <label class="check"><input type="checkbox" data-key="showLabel"> Label above the title</label>
  <div class="row"><label>Label text</label><input type="text" data-key="labelText" maxlength="30"></div>
  <label class="check"><input type="checkbox" data-key="shadow"> Drop shadow</label>
  <label class="check"><input type="checkbox" data-key="blur"> Blur behind card</label>
  <label class="check"><input type="checkbox" data-key="showPaused"> Keep card up while paused</label>

  <div class="btns">
    <button class="main" id="save">Save</button>
    <button class="ghost" id="reset">Reset</button>
  </div>
  <div id="status"></div>
</aside>

<main>
  <div class="bar">
    <span>Preview background:</span>
    <button data-bg="dark" class="on">Dark</button><button data-bg="light">Light</button><button data-bg="game">Colourful</button>
  </div>
  <div id="stageWrap" data-bg="dark"><iframe id="pv" src="./?demo=1&preview=1"></iframe></div>
  <div class="url">
    OBS Browser Source: <code id="obsUrl"></code> &nbsp; Width <b>1920</b>, Height <b>1080</b> (your canvas size).<br>
    Saved changes show up in OBS within a few seconds, no refresh needed.
  </div>
</main>
</div>

<script>
const $ = s => document.querySelector(s);
const KEY = new URLSearchParams(location.search).get('key') || '';
const API = 'api/settings' + (KEY ? '?key=' + encodeURIComponent(KEY) : '');
const POS = ['top-left','top-center','top-right','center-left','center','center-right','bottom-left','bottom-center','bottom-right'];
const DEFAULTS = {
  position: 'bottom-left', margin: 32, width: 420, scale: 100, bgColor: '#121212', bgOpacity: 82,
  textColor: '#ffffff', accent: '#1db954', font: 'segoe', titleSize: 20, artistSize: 15, radius: 16,
  showArt: true, showProgress: true, showLabel: true, labelText: 'Now playing', showPaused: false, shadow: true, blur: true,
};
let state = { ...DEFAULTS }, saved = JSON.stringify(state);
const pv = $('#pv'), wrap = $('#stageWrap'), status = $('#status');

// position buttons
POS.forEach(p => {
  const b = document.createElement('button');
  b.dataset.pos = p; b.title = p.replace('-', ' ');
  b.onclick = () => { state.position = p; push(); };
  $('#pos').appendChild(b);
});

function render() {
  document.querySelectorAll('#pos button').forEach(b => b.classList.toggle('on', b.dataset.pos === state.position));
  document.querySelectorAll('[data-key]').forEach(el => {
    const v = state[el.dataset.key];
    if (el.type === 'checkbox') el.checked = !!v; else if (el.value != v) el.value = v;
  });
  document.querySelectorAll('output').forEach(o => {
    const k = o.dataset.for, unit = k === 'scale' || k === 'bgOpacity' ? '%' : 'px';
    o.textContent = state[k] + unit;
  });
  const dirty = JSON.stringify(state) !== saved;
  if (dirty) { status.className = ''; status.textContent = 'Unsaved changes'; }
}
function push() { render(); pv.contentWindow && pv.contentWindow.postMessage({ type: 'settings', settings: state }, '*'); }

document.querySelectorAll('[data-key]').forEach(el => {
  el.addEventListener('input', () => {
    state[el.dataset.key] = el.type === 'checkbox' ? el.checked : el.type === 'range' ? Number(el.value) : el.value;
    push();
  });
});

addEventListener('message', e => { if (e.data && e.data.type === 'ready') push(); });

// scale the 1920x1080 preview to fit the panel
function fitPv() { pv.style.transform = `scale(${wrap.clientWidth / 1920})`; }
new ResizeObserver(fitPv).observe(wrap); fitPv();

document.querySelectorAll('.bar button').forEach(b => b.onclick = () => {
  wrap.dataset.bg = b.dataset.bg;
  document.querySelectorAll('.bar button').forEach(x => x.classList.toggle('on', x === b));
});

$('#save').onclick = async () => {
  status.className = ''; status.textContent = 'Saving...';
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state) });
    if (!r.ok) throw new Error(r.status === 403 ? 'Wrong or missing admin key' : 'Save failed');
    state = await r.json(); saved = JSON.stringify(state); push();
    status.className = 'ok'; status.textContent = 'Saved. OBS will update in a few seconds.';
  } catch (e) { status.className = 'err'; status.textContent = e.message; }
};
$('#reset').onclick = () => { state = { ...DEFAULTS }; push(); };

$('#obsUrl').textContent = new URL('./', location.href).href;
fetch('api/settings', { cache: 'no-store' }).then(r => r.json()).then(s => { state = s; saved = JSON.stringify(s); push(); status.textContent = ''; });
</script>
</body>
</html>
